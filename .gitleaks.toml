# =====================================================
#  .gitleaks.toml
#  Règles custom + allowlist pour réduire les faux positifs.
# =====================================================

[extend]
useDefault = true

[allowlist]
description = "Faux positifs documentés"

# Les fichiers d'exemple contiennent des placeholders.
paths = [
    '''.env\.example$''',
    '''\.env\.example$''',
    '''SECURITY\.md$''',
    '''ARCHITECTURE\.md$''',
    '''^venv/''',
    '''^backend/venv/''',
    '''^\.venv/''',
    '''^node_modules/''',
]

# Patterns explicitement faux (placeholders documentés)
regexes = [
    '''sk-xxxxxxxx''',
    '''sk-\.\.\.''',
    '''apify_api_\.\.\.''',
    '''<password>''',
    '''<user>''',
    '''<TOKEN>''',
    '''change-me''',
    '''AKIAchen''',         # chaîne PIL ImageFont
]
