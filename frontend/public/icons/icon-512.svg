<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Radar/pulse rings (veille = surveillance) -->
  <circle cx="256" cy="240" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.10"/>
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.06"/>

  <!-- Eye icon (veille = watch/observe) -->
  <path d="M 136 240 Q 196 170 256 170 Q 316 170 376 240 Q 316 310 256 310 Q 196 310 136 240 Z"
        fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Iris -->
  <circle cx="256" cy="240" r="40" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>

  <!-- Pupil with glow -->
  <circle cx="256" cy="240" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Light reflection -->
  <circle cx="246" cy="232" r="6" fill="white" opacity="0.8"/>

  <!-- Small signal dots around the eye -->
  <circle cx="160" cy="200" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="352" cy="200" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="180" cy="280" r="3" fill="#06b6d4" opacity="0.5"/>
  <circle cx="332" cy="280" r="3" fill="#06b6d4" opacity="0.5"/>

  <!-- "971" text below -->
  <text x="256" y="380"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="48"
        font-weight="800"
        fill="white"
        text-anchor="middle"
        letter-spacing="8"
        opacity="0.9">971</text>

  <!-- "VEILLE" micro text -->
  <text x="256" y="410"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="18"
        font-weight="600"
        fill="url(#accentGrad)"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.7">VEILLE</text>
</svg>
