<svg width="192" height="192" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Eye icon -->
  <path d="M 136 250 Q 196 175 256 175 Q 316 175 376 250 Q 316 325 256 325 Q 196 325 136 250 Z"
        fill="none" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Iris -->
  <circle cx="256" cy="250" r="44" fill="none" stroke="url(#accentGrad)" stroke-width="5"/>

  <!-- Pupil -->
  <circle cx="256" cy="250" r="20" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Reflection -->
  <circle cx="246" cy="242" r="7" fill="white" opacity="0.8"/>

  <!-- 971 -->
  <text x="256" y="400"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="64"
        font-weight="800"
        fill="white"
        text-anchor="middle"
        letter-spacing="10"
        opacity="0.9">971</text>
</svg>
