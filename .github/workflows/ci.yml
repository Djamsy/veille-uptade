name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + typecheck + collect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      # Ruff : non-bloquant pour l'instant. Le repo a ~2321 erreurs héritées
      # à nettoyer dans une PR dédiée (cf. BROKEN.md, section "Ruff backlog").
      # Une fois `ruff check .` à zéro erreur, retirer continue-on-error.
      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

      - name: Mypy (soft, non-bloquant pour l'instant)
        run: mypy backend || echo "::warning::mypy a remonté des erreurs (non bloquant)"
        continue-on-error: true

      - name: Pytest — collecte uniquement (imports cassés = échec)
        run: pytest --collect-only -q

  frontend:
    name: Frontend (lint + typecheck + build smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run type-check --if-present

      - name: Build smoke
        run: npm run build
        env:
          # Build accepte des valeurs factices ; on veut juste vérifier que ça compile.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder

  secrets-scan:
    name: Gitleaks (secrets in diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
