services:
  - type: web
    name: veille-api
    env: python
    # Installation de Chromium pour le rendu PNG du bilan (non bloquante :
    # si l'env natif Render manque des libs système, le bilan hebdo retombe
    # sur le digest texte sans casser le build).
    buildCommand: pip install -r backend/requirements.txt && (python -m playwright install chromium || echo "playwright chromium install skipped")
    startCommand: >-
      uvicorn backend.server:app
      --host=0.0.0.0
      --port=10000
      --workers=1
      --loop=uvloop
      --limit-concurrency=100
      --timeout-keep-alive=30
      --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # URL publique du front (pour le rendu PNG serveur du bilan).
      # À définir dans le dashboard Render. Si absent → digest texte.
      - key: FRONTEND_URL
        sync: false
