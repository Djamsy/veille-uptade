services:
  - type: web
    name: veille-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      uvicorn backend.server:app
      --host=0.0.0.0
      --port=10000
      --workers=1
      --loop=uvloop
      --limit-concurrency=100
      --timeout-keep-alive=30
      --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
