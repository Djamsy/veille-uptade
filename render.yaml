services:
  - type: web
    name: veille-api
    # Runtime Docker : l'image (Dockerfile) embarque Chromium + libs système
    # pour le rendu PNG du bilan. Garantit le PNG automatique du lundi.
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # URL publique du front (pour le rendu PNG serveur du bilan).
      # À définir dans le dashboard Render. Si absent → digest texte.
      - key: FRONTEND_URL
        sync: false
